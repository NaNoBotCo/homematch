name = "homematch"
main = "src/worker.mjs"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# D1 database binding. Migrations:
#   npx wrangler d1 migrations apply homematch --remote
# Operator rows (one per tenant file):
#   node scripts/operator-sql.mjs motdang > /tmp/op.sql
#   npx wrangler d1 execute homematch --remote --file=/tmp/op.sql
[[d1_databases]]
binding = "DB"
database_name = "homematch"
database_id = "cb29c007-2d9d-41ca-826e-be8c725fc50c"
migrations_dir = "migrations"

# Photos of the work. Only photos that passed the check are stored; a refused
# photo never reaches the bucket. Served through the Worker, never listable.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "homematch-media"

# Workers AI: Llama Guard on listing text, Mistral Small on photos.
[ai]
binding = "AI"

# Share cards: Cloudflare's headless Chrome draws each listing's 1200×630
# card once per version (src/card.mjs); the PNG is kept in MEDIA under cards/.
[browser]
binding = "BROWSER"

# The digest: tick() every 30 minutes; it sends the daily one at 08:00
# Bangkok and an interim one when something needs a look.
[triggers]
crons = ["*/30 * * * *"]

# motdang.net/home-help — this Worker answers the path by route; the site
# Worker (mot-dang-site, route motdang.net/*) keeps every other path. The more
# specific route wins. BASE_PATH is stripped before the app sees the request.
[[routes]]
pattern = "motdang.net/home-help*"
zone_name = "motdang.net"

[vars]
BASE_PATH = "/home-help"
# The approval bot's digest goes here through Resend.
ALERT_TO = "nan@motdang.net"
ALERT_FROM = "มดแดง Mot Dang <nan@motdang.net>"

# Secrets, set with `npx wrangler secret put <NAME>`, never in this file:
#   SESSION_SECRET  salt for the per-connection daily cap
#   ADMIN_KEY       password for /admin (any user name)
#   RESEND_KEY      Resend sending key for motdang.net; unset = no alert mail
